name: "Broadlink Manager"
description: "Easely learn and send IR/RF Command"
codenotary: tomer.klein@gmail.com
version: "5.8.5"
slug: "broadlink_manager"
panel_icon: mdi:remote
# panel_admin: false
# hassio_api: true
# hassio_role: manager
ingress: true
ingress_port: 7020
ingress_stream: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: before
# Deliberately NOT host_network: with it the app binds 0.0.0.0:7020 on the host
# regardless of the ports mapping, exposing the unauthenticated API to the LAN.
# Bridge networking keeps it reachable only through Ingress. The cost is that
# broadcast auto-discovery no longer reaches the LAN; add devices by IP, or set
# DISCOVERY_DST_IP to a unicast address or subnet broadcast.
url: https://github.com/t0mer/broadlinkmanager-docker
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  ssl: false
schema:
  certfile: str
  keyfile: str
  ssl: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)?

